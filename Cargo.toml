[package]
name = "edudar-installer"
version = "0.1.0"
edition = "2021"
description = "Official Open-Source Web Installer & Launcher for Edudar"
license = "MIT"
authors = ["Edudar Team <support@edudar.app>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
ureq = { version = "2.9", default-features = false, features = ["tls", "json", "gzip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
