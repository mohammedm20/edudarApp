name: Build and Sign Edudar Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build-and-sign:
    name: Build and Sign Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Unsigned Artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdudarSetup-unsigned
          path: target/release/edudar-installer.exe

      - name: Submit Signing Request to SignPath
        if: ${{ env.HAVE_TOKEN != '' }}
        env:
          HAVE_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '1ff342f3-17f7-4aae-a352-2439d26a15d4'
          project-slug: 'linkpen'
          signing-policy-slug: 'test-signing'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-output'

      - name: Upload Signed Artifact
        if: ${{ env.HAVE_TOKEN != '' }}
        env:
          HAVE_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: EdudarSetup-signed
          path: signed-output/
