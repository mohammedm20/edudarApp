name: Build and Sign Edudar Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Bootstrapper
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdudarSetup-unsigned
          path: target/release/edudar-installer.exe

  sign:
    name: Sign Executable with SignPath
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit Signing Request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID || ''1ff342f3-17f7-4aae-a352-2439d26a15d4'' }}'
          project-slug: 'linkpen'
          signing-policy-slug: 'test-signing'
          github-artifact-name: 'EdudarSetup-unsigned'
          output-artifact-name: 'EdudarSetup-signed'
          wait-for-completion: true

